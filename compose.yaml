
name: sri-bhagyalakshmi-textiles

services:
  database:
    image: postgres:16
    container_name: sbt-database
    environment:
      POSTGRES_DB: textiles
      POSTGRES_USER: textiles_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - sbt-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U textiles_user -d textiles"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sbt-database-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sbt-backend
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      DATABASE_URL: postgres://textiles_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/textiles
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      TRUST_PROXY: "1"
    expose:
      - "3000"
    volumes:
      - sbt-data:/data
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sbt-frontend-network
      - sbt-database-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sbt-frontend
    ports:
      - "8081:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sbt-frontend-network
    restart: unless-stopped

networks:
  sbt-frontend-network:
    name: sbt-frontend-network
    driver: bridge

  sbt-database-network:
    name: sbt-database-network
    driver: bridge
    internal: true

volumes:
  sbt-postgres-data:
    name: sbt-postgres-data

  sbt-data:
    name: sbt-data
